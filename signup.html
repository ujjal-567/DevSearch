<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign Up - DevSearch</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container{max-width:420px;margin:60px auto;padding:24px;background:rgba(255,255,255,0.8);backdrop-filter:blur(8px);border-radius:12px;border:1px solid rgba(0,0,0,0.06)}
    .auth-container h2{margin-bottom:14px}
    .form-group{margin-bottom:12px}
    .form-input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border-color)}
    .btn-primary{background:linear-gradient(135deg,#4285F4,#3367D6);color:#fff;padding:10px 16px;border-radius:10px;border:none;cursor:pointer}
    .muted{color:var(--text-secondary);font-size:13px}
    .message{margin-top:12px}
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Create an account</h2>
    <div class="form-group">
      <label>Name</label>
      <input id="name" class="form-input" placeholder="Full name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="email" type="email" class="form-input" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" class="form-input" placeholder="Choose a password">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input id="password2" type="password" class="form-input" placeholder="Confirm password">
    </div>
    <button id="signupBtn" class="btn-primary">Sign up</button>
    <div class="message" id="msg"></div>
    <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script>
    const API = 'http://localhost:3001';
    const msg = document.getElementById('msg');

    document.getElementById('signupBtn').addEventListener('click', async () => {
      msg.textContent = '';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (!name || !email || !password) { msg.textContent = 'Please fill all required fields'; return; }
      if (password.length < 6) { msg.textContent = 'Password must be at least 6 characters'; return; }
      if (password !== password2) { msg.textContent = 'Passwords do not match'; return; }

      try {
        const res = await fetch(API + '/signup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          msg.style.color = 'green';
          msg.textContent = 'Account created — redirecting to login...';
          setTimeout(() => { window.location.href = 'login.html'; }, 1200);
        } else {
          msg.style.color = 'crimson';
          msg.textContent = data.error || 'Signup failed';
        }
      } catch (err) {
        msg.style.color = 'crimson';
        msg.textContent = 'Network error. Is the auth server running?';
      }
    });
  </script>
</body>
</html>
