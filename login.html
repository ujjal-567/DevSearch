<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - DevSearch</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container{max-width:420px;margin:60px auto;padding:24px;background:rgba(255,255,255,0.8);backdrop-filter:blur(8px);border-radius:12px;border:1px solid rgba(0,0,0,0.06)}
    .auth-container h2{margin-bottom:14px}
    .form-group{margin-bottom:12px}
    .form-input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border-color)}
    .btn-primary{background:linear-gradient(135deg,#4285F4,#3367D6);color:#fff;padding:10px 16px;border-radius:10px;border:none;cursor:pointer}
    .muted{color:var(--text-secondary);font-size:13px}
    .message{margin-top:12px}
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Sign in to DevSearch</h2>
    <div class="form-group">
      <label>Email</label>
      <input id="email" type="email" class="form-input" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" class="form-input" placeholder="Your password">
    </div>
    <button id="loginBtn" class="btn-primary">Log in</button>
    <div class="message" id="msg"></div>
    <p class="muted">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

  <script>
    const API = 'http://localhost:3001';
    const msg = document.getElementById('msg');

    document.getElementById('loginBtn').addEventListener('click', async () => {
      msg.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) { msg.textContent = 'Please fill both fields'; return; }

      try {
        const res = await fetch(API + '/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          msg.style.color = 'green';
          msg.textContent = 'Login successful — welcome ' + (data.user.name || data.user.email);
          // Save basic session (NOT secure, just for demo)
          localStorage.setItem('devsearchUser', JSON.stringify(data.user));
          setTimeout(() => { window.location.href = 'index.html'; }, 900);
        } else {
          msg.style.color = 'crimson';
          msg.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        msg.style.color = 'crimson';
        msg.textContent = 'Network error. Is the auth server running?';
      }
    });
  </script>
</body>
</html>
